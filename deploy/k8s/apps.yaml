  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: product-service
          image: reloop/product-service:local
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - npx prisma db push --skip-generate && node src/server.js
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: reloop-config
            - secretRef:
                name: reloop-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reloop-secrets
                  key: DATABASE_URL_PRODUCT
          startupProbe:
            httpGet:
              path: /health
              port: 3002
            periodSeconds: 5
            failureThreshold: 120
