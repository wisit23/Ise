apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: mongo
  ports:
    - name: tcp
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "quit(db.hello().isWritablePrimary ? 0 : 1)"]
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              for attempt in $(seq 1 120); do
                if mongosh --host mongo:27017 --quiet --eval 'quit(db.runCommand({ping:1}).ok ? 0 : 1)'; then break; fi
                sleep 2
              done
              mongosh --host mongo:27017 --quiet --eval '
                try { rs.status(); }
                catch (e) {
                  if (e.code === 94) {
                    rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo-0.mongo:27017"}]});
                  } else { throw e; }
                }'
              for attempt in $(seq 1 120); do
                if mongosh --host mongo:27017 --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
                sleep 2
              done
              exit 1
