services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # chat-service's document store (CHAT-001). Prisma's MongoDB connector needs
  # transactions, which Mongo only supports on a replica set — even a
  # single-node one — so this isn't a plain standalone mongod. See
  # infra/mongo/init-replica.sh for the one-time rs.initiate() this requires.
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      # Up != usable: a freshly-started mongod answers ping before
      # rs.initiate() has run, and every write fails with "not primary" until
      # the replica set actually elects one. rs.status() only returns without
      # error once a primary exists, so that's what depends_on needs to wait
      # on, not just "the process is listening".
      test: ["CMD", "mongosh", "--quiet", "--eval", "rs.status().ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: calls rs.initiate() exactly once, then exits. Re-running
  # rs.initiate() on an already-initialized set is a no-op error, not
  # destructive, so this is safe to leave in the normal `up` path rather than
  # requiring a separate manual bootstrap step.
  mongo-init:
    image: mongo:7
    depends_on:
      - mongo
    volumes:
      - ./infra/mongo/init-replica.sh:/init-replica.sh:ro
    entrypoint: ["sh", "/init-replica.sh"]

  gateway:
    build:
      context: .
      dockerfile: backend/gateway/Dockerfile
    env_file: .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      CHAT_SERVICE_URL: http://chat-service:3004
      REVIEW_SERVICE_URL: http://review-service:3005
      SUPPORT_SERVICE_URL: http://support-service:3006
    ports:
      - "${GATEWAY_PORT}:8080"
    depends_on:
      - auth-service
      - product-service
      - order-service
      - chat-service
      - review-service
      - support-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: backend/services/auth-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_AUTH}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build:
      context: .
      dockerfile: backend/services/product-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_PRODUCT}
    volumes:
      - product_uploads:/app/services/product-service/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build:
      context: .
      dockerfile: backend/services/order-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_ORDER}
      PRODUCT_SERVICE_URL: http://product-service:3002
    volumes:
      - order_private_evidence:/app/services/order-service/private-evidence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3003/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-service:
    build:
      context: .
      dockerfile: backend/services/chat-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_CHAT}
      REDIS_URL: ${REDIS_URL}
      PRODUCT_SERVICE_URL: http://product-service:3002
      # Chat resolves participant userIds into display names through
      # auth-service's /internal API (see src/services/authClient.js).
      AUTH_SERVICE_URL: http://auth-service:3001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    volumes:
      # Chat attachments are private (participant-only reads through
      # attachmentController) — they get their own volume rather than
      # sharing product-service's publicly-served uploads/ tree.
      - chat_private_attachments:/app/services/chat-service/private-attachments
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3004/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  review-service:
    build:
      context: .
      dockerfile: backend/services/review-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_REVIEW}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3005/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  support-service:
    build:
      context: .
      dockerfile: backend/services/support-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_SUPPORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3006/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: .env
    environment:
      # inotify events do not cross a Windows bind mount, so Next's dev server
      # never sees edits made on the host and new routes 404 until the
      # container is restarted. Polling costs a little CPU and makes hot
      # reload work the same on every OS.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/frontend/.next
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - gateway

volumes:
  pgdata:
  mongodata:
  chat_private_attachments:
  product_uploads:
  order_private_evidence:
