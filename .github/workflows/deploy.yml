name: Deploy release

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Release images run ID
        required: true
        type: string
      mode:
        description: Promote or schema-compatible rollback to the recorded previous release
        required: true
        type: choice
        options: [promote, rollback]
      migrate:
        description: Reviewed maintenance with verified backup exporter (never for rollback)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_run_id: ${{ steps.inputs.outputs.release_run_id }}
      mode: ${{ steps.inputs.outputs.mode }}
      migration: ${{ steps.inputs.outputs.migration }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify trusted release run
        id: inputs
        uses: actions/github-script@v7
        env:
          RELEASE_RUN: ${{ inputs.release_run_id }}
          MODE: ${{ inputs.mode }}
          MIGRATE: ${{ inputs.migrate || 'false' }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const id = process.env.RELEASE_RUN;
            if (!/^[1-9][0-9]*$/.test(id)) throw Error('Invalid release run ID');
            const run = (await github.rest.actions.getWorkflowRun({owner, repo, run_id: Number(id)})).data;
            if (run.path !== '.github/workflows/release.yml' || run.head_branch !== 'main' ||
                run.event !== 'workflow_run' || run.status !== 'completed' || run.conclusion !== 'success') {
              throw Error('Only successful main Release images runs can be deployed');
            }
            if (!['promote', 'rollback'].includes(process.env.MODE)) throw Error('Invalid mode');
            if (process.env.MODE === 'rollback' && process.env.MIGRATE === 'true') throw Error('Rollback cannot migrate');
            core.setOutput('release_run_id', id);
            core.setOutput('mode', process.env.MODE);
            core.setOutput('migration', process.env.MIGRATE === 'true' ? 'migrate' : 'no-migrate');
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.inputs.outputs.release_run_id }}
          name: release
          path: release-input
      - name: Verify manifest provenance
        env:
          RELEASE_RUN: ${{ steps.inputs.outputs.release_run_id }}
        run: |
          python3 deploy/cicd/release.py validate release-input/release.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = Path('release-input/release.json').read_bytes()
          value = json.loads(manifest)
          expected_run = 'https://github.com/wisit23/Ise/actions/runs/' + os.environ['RELEASE_RUN']
          if value['run_url'] != expected_run:
              raise SystemExit('Manifest is not from the selected release run')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-input
          overwrite: true
          path: release-input/release.json
          retention-days: 90

  deploy:
    needs: prepare
    name: Approve and request production deployment
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    # Configure required reviewers on this GitHub Environment before enabling CD.
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deployment-input
          path: release-input
      - name: Publish approved deployment request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ needs.prepare.outputs.mode }}
          MIGRATION: ${{ needs.prepare.outputs.migration }}
          RELEASE_RUN: ${{ needs.prepare.outputs.release_run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = Path('release-input/release.json').read_bytes()
          request = {'version': 1, 'environment': 'production',
            'deploy_run_id': int(os.environ['GITHUB_RUN_ID']),
            'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
            'release_run_id': int(os.environ['RELEASE_RUN']),
            'mode': os.environ['MODE'], 'migrate': os.environ['MIGRATION'] == 'migrate',
            'manifest_sha256': hashlib.sha256(manifest).hexdigest()}
          Path('request.json').write_text(json.dumps(request) + '\n')
          PY
          tag="production-request-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" request.json release-input/release.json \
            --target "$GITHUB_SHA" --title "Approved production request $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --notes "Approved deployment request. Actual deployment status is recorded in the VM journal, not this workflow result." \
            --latest=false
      - name: Deployment summary
        if: always()
        env:
          STATE: ${{ job.status }}
          RELEASE_RUN: ${{ needs.prepare.outputs.release_run_id }}
        run: |
          printf 'Environment: production\nRequest publication: %s\nRelease run: %s\n' "$STATE" "$RELEASE_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo 'The VM checks approved requests every two minutes. Publication success does not mean deployment success. Check ise-pull.service and the private deployment journal on the VM.' >> "$GITHUB_STEP_SUMMARY"
