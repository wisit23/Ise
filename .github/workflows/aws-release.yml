name: AWS stage backend (build images)

on:
  push:
    branches: [fullcloudstaging, fullcloudmain]
  workflow_dispatch:

permissions:
  contents: read

# Push pipelines queue among themselves; the deploy job takes the shared
# aws-backend-staging lock (in aws-eks-staging.yml), so it also serializes
# against manual deploys. Manual builds keep the original shared group.
concurrency:
  group: aws-backend-staging${{ github.event_name == 'push' && '-pipeline' || '' }}
  queue: max
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  verify:
    if: github.ref == 'refs/heads/fullcloudstaging' || github.ref == 'refs/heads/fullcloudmain'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository account configuration
        run: |
          if ! [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo '::error::Set repository variable AWS_ACCOUNT_ID to the 12-digit AWS staging account ID.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx eslint backend/gateway backend/shared/src/corsOptions.js backend/shared/src/corsOptions.test.js backend/services/chat-service/src/realtime/socketServer.js
      - run: node --test backend/gateway/src/awsDeployment.test.js backend/shared/src/corsOptions.test.js
      - run: node --test backend/shared/src/backgroundWorkers.test.js backend/shared/src/backgroundWorkerEntrypoints.test.js backend/shared/src/serviceRuntime.test.js backend/shared/src/serviceRuntime.signals.test.js
      - run: python3 -B -m unittest discover -s deploy/aws -p 'test_*.py' -v
      - run: node --test scripts/ci/awsPipeline.test.cjs
      - run: node scripts/ci/release-audit.cjs

  images:
    needs: verify
    runs-on: ubuntu-latest
    environment: aws-staging
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component:
          [
            gateway,
            auth-service,
            product-service,
            order-service,
            chat-service,
            support-service,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: docker/setup-buildx-action@v3
      - name: Login and select build target
        id: config
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          workspace="backend/services/$COMPONENT"
          runtime="services/$COMPONENT"
          if [ "$COMPONENT" = gateway ]; then workspace=backend/gateway; runtime=gateway; fi
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/cicd/Dockerfile
          target: backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.config.outputs.registry }}/reloop/${{ matrix.component }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            WORKSPACE=${{ steps.config.outputs.workspace }}
            RUNTIME_PATH=${{ steps.config.outputs.runtime }}
          cache-from: type=gha,scope=aws-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=aws-${{ matrix.component }}
      - name: Record immutable image
        env:
          COMPONENT: ${{ matrix.component }}
          REGISTRY: ${{ steps.config.outputs.registry }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          app = os.environ['COMPONENT']
          record = {'component': app, 'commit': os.environ['GITHUB_SHA'],
                    'image': os.environ['REGISTRY'] + '/reloop/' + app + '@' + os.environ['DIGEST']}
          Path(app + '.json').write_text(json.dumps(record))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aws-image-${{ matrix.component }}
          path: ${{ matrix.component }}.json
          retention-days: 30

  bundle:
    needs: images
    runs-on: ubuntu-latest
    environment: aws-staging
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aws-image-*
          path: image-records
          merge-multiple: true
      - name: Build bootstrap or deployment bundle
        run: |
          python3 deploy/aws/bundle.py --images image-records --commit "$GITHUB_SHA" \
            --version-label "$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --region "$AWS_REGION" --registry "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" \
            --output out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-release
          path: out/
          if-no-files-found: error
          retention-days: 30

  # Deploy each successful fullcloudmain push build: rolling before bootstrap,
  # blue/green after. The called job uses environment aws-production, so its
  # required reviewers approve before anything changes. fullcloudstaging pushes
  # only verify and build. Set repository variable AWS_AUTO_DEPLOY=false to pause
  # deployment without editing code.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fullcloudmain' && vars.AWS_AUTO_DEPLOY != 'false'
    needs: bundle
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/aws-eks-staging.yml
    with:
      deploy: true
      compatible: true
      auto: true
    secrets: inherit
