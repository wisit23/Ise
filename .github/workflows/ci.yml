name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Secret scan
        if: ${{ !cancelled() }}
        run: npm run secret-scan
      - name: Dependency audit (existing advisory debt)
        if: ${{ !cancelled() }}
        run: npm run audit
        continue-on-error: true
      - name: Validate Compose configuration
        if: ${{ !cancelled() }}
        run: |
          cp .env.example .env
          docker compose config --quiet

  core-tests:
    name: Tests / ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [shared, gateway, scripts]
    env:
      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      INTERNAL_SERVICE_TOKEN: ci-test-internal-token
      # Client generation needs a datasource value; core tests do not connect.
      DATABASE_URL: postgresql://reloop:reloop_test@127.0.0.1:5432/reloop_ci_auth?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run component tests
        run: npm run test:service -- ${{ matrix.component }}
      - name: Upload component test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.component }}
          path: coverage/${{ matrix.component }}/
          retention-days: 14
          if-no-files-found: warn

  service-tests:
    name: Tests / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service:
          [
            auth-service,
            product-service,
            order-service,
            chat-service,
            support-service,
          ]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reloop
          POSTGRES_PASSWORD: reloop_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reloop"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://reloop:reloop_test@127.0.0.1:5432/reloop_ci_auth?schema=public
      DATABASE_URL_AUTH: postgresql://reloop:reloop_test@127.0.0.1:5432/reloop_ci_auth?schema=public
      DATABASE_URL_PRODUCT: postgresql://reloop:reloop_test@127.0.0.1:5432/reloop_ci_product?schema=public
      DATABASE_URL_ORDER: postgresql://reloop:reloop_test@127.0.0.1:5432/reloop_ci_order?schema=public
      DATABASE_URL_SUPPORT: postgresql://reloop:reloop_test@127.0.0.1:5432/reloop_ci_support?schema=public
      DATABASE_URL_CHAT: mongodb://127.0.0.1:27017/reloop_ci_chat?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://127.0.0.1:6379
      INTERNAL_SERVICE_TOKEN: ci-test-internal-token
      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Prepare isolated PostgreSQL databases with real migrations
        run: npm run ci:prepare
      - name: Start MongoDB replica set for Chat tests
        if: matrix.service == 'chat-service'
        run: |
          set -euo pipefail
          docker run -d --name ci-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          ready=false
          for _ in {1..60}; do
            if docker exec ci-mongo mongosh --quiet --eval 'quit(db.runCommand({ping:1}).ok ? 0 : 1)' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          ready=false
          for _ in {1..60}; do
            if docker exec ci-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
      - name: Prepare Chat schema
        if: matrix.service == 'chat-service'
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_CHAT }}
        run: npx prisma db push --schema backend/services/chat-service/prisma/schema.prisma --skip-generate
      - name: Run service unit and integration tests
        run: npm run test:service -- ${{ matrix.service }}
      - name: Upload service test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.service }}
          path: coverage/${{ matrix.service }}/
          retention-days: 14
          if-no-files-found: warn
      - name: Mongo diagnostics
        if: failure() && matrix.service == 'chat-service'
        run: docker logs ci-mongo || true

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --workspace frontend run test -- --runInBand
      - run: npm --workspace frontend run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-frontend
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: warn

  docker-build:
    name: Docker build / ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: auth-service
            dockerfile: backend/services/auth-service/Dockerfile
          - component: product-service
            dockerfile: backend/services/product-service/Dockerfile
          - component: order-service
            dockerfile: backend/services/order-service/Dockerfile
          - component: chat-service
            dockerfile: backend/services/chat-service/Dockerfile
          - component: support-service
            dockerfile: backend/services/support-service/Dockerfile
          - component: gateway
            dockerfile: backend/gateway/Dockerfile
          - component: frontend
            dockerfile: frontend/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4
      - name: Build image only (no publish or deployment)
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          COMPONENT: ${{ matrix.component }}
        run: docker build --progress=plain --file "$DOCKERFILE" --tag "reloop-ci:$COMPONENT" .

  ci-result:
    name: CI result
    needs: [quality-gate, core-tests, service-tests, frontend, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every stage to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$RESULTS" | jq -e 'all(.[]; .result == "success")'
